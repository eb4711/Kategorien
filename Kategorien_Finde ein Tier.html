    <style>
        * {
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            touch-action: manipulation;
            /* Dunkler, türkis-blauer Hintergrund mit leichtem Verlauf */
            background: radial-gradient(circle at center, #0284c7 0%, #0369a1 50%, #082f49 100%);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .pop-in {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1); }
        }

        .shake {
            animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
            40%, 60% { transform: translate3d(7px, 0, 0); }
        }

        .bounce-slow {
            animation: bounce 2.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .btn-3d {
            transition: all 0.12s ease;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
        }

        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
        }

        /* Einheitlicher gelber Rahmen (border-amber-400), der dynamisch grün/rot übersteuert werden kann */
        .game-card {
            transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 6px solid #fbbf24; 
            background-color: #0369a1;
            overflow: hidden;
        }

        .game-card:active {
            transform: scale(0.95);
        }

        /* Foto füllt die Karte vollständig aus – kein weißer Rand */
        .card-img {
            object-fit: cover;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* AUDIO SYNTHESE & WEB AUDIO API */
        let audioCtx = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (isAudioMuted) return;
            initAudioContext();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                const freqs = [523.25, 659.25, 783.99, 1046.50];

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    gain.gain.setValueAtTime(0.25, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.28);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.28);
                });
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.22);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            } else if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(480, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        /* PHONETISCHE KORREKTUR FÜR HARTES "T" BEI TIER */
        function prepareTextForSpeech(rawText) {
            return rawText.replace(/T-ier|Tier/g, "T'ier");
        }

        function speak(text, callback) {
            if (isAudioMuted || !('speechSynthesis' in window)) {
                if (callback) callback();
                return;
            }

            window.speechSynthesis.cancel();
            
            const processedText = prepareTextForSpeech(text);
            const utterance = new SpeechSynthesisUtterance(processedText);
            utterance.lang = 'de-DE';
            utterance.rate = 0.65; // Sehr langsam und deutlich für Vorschulkinder
            utterance.pitch = 1.05;

            if (callback) {
                utterance.onend = callback;
                utterance.onerror = callback;
            }

            window.speechSynthesis.speak(utterance);
        }

        /* AUDIO BUTTON: STUMM OHNE GESPROCHENES FEEDBACK */
        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            const icon = document.getElementById('audio-icon');
            const btn = document.getElementById('btn-audio');

            if (isAudioMuted) {
                icon.className = 'fa-solid fa-volume-xmark';
                btn.classList.remove('bg-emerald-500');
                btn.classList.add('bg-slate-500');
                window.speechSynthesis.cancel();
            } else {
                icon.className = 'fa-solid fa-volume-high';
                btn.classList.remove('bg-slate-500');
                btn.classList.add('bg-emerald-500');
            }
        }

        function showScreen(screenId) {
            ['screen-start', 'screen-game', 'screen-end'].forEach(id => {
                const el = document.getElementById(id);
                if (id === screenId) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });

            const homeBtn = document.getElementById('btn-home');
            if (screenId === 'screen-start') {
                homeBtn.classList.add('opacity-50', 'pointer-events-none');
            } else {
                homeBtn.classList.remove('opacity-50', 'pointer-events-none');
            }
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = score;
        }

        function startNewGame() {
            initAudioContext();
            playSound('click');
            score = 0;
            currentQuestion = 0;
            lastCategoryKey = null;
            usedImageIdsInRun.clear();
            updateScoreDisplay();
            showNextQuestion();
            showScreen('screen-game');
        }

        function returnToMainMenu() {
            playSound('click');
            window.speechSynthesis.cancel();
            showScreen('screen-start');
        }

        function getRandomElem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function shuffle(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function getValidDistractors(targetCatKey, count) {
            const targetTag = DATABASE[targetCatKey].tag;
            const candidates = [];

            CATEGORY_KEYS.forEach(key => {
                if (key !== targetCatKey) {
                    DATABASE[key].items.forEach(item => {
                        if (!usedImageIdsInRun.has(item.id) && !item.tags.includes(targetTag)) {
                            candidates.push(item);
                        }
                    });
                }
            });

            let chosenList = shuffle(candidates);
            if (chosenList.length < count) {
                const fallbackCandidates = [];
                CATEGORY_KEYS.forEach(key => {
                    if (key !== targetCatKey) {
                        DATABASE[key].items.forEach(item => {
                            if (!item.tags.includes(targetTag)) {
                                fallbackCandidates.push(item);
                            }
                        });
                    }
                });
                chosenList = shuffle(fallbackCandidates);
            }

            const selected = [];
            const usedCats = new Set();

            for (const cand of chosenList) {
                const candCat = CATEGORY_KEYS.find(k => DATABASE[k].items.some(i => i.id === cand.id));
                if (!usedCats.has(candCat)) {
                    selected.push(cand);
                    usedCats.add(candCat);
                }
                if (selected.length === count) break;
            }

            return selected;
        }

        function showNextQuestion() {
            isAnsweringBlocked = false;
            document.getElementById('feedback-message').classList.add('opacity-0');

            // 1. Niemals zweimal dieselbe Kategorie hintereinander
            let availableCats = CATEGORY_KEYS.filter(k => k !== lastCategoryKey);
            const targetCatKey = getRandomElem(availableCats);
            lastCategoryKey = targetCatKey;

            const targetCatData = DATABASE[targetCatKey];
            currentSpeechPromptText = targetCatData.speechPrompt || targetCatData.prompt;

            // 2. Keine doppelten Bilder aus dem vorherigen Durchgang
            let unusedItems = targetCatData.items.filter(i => !usedImageIdsInRun.has(i.id));
            if (unusedItems.length === 0) {
                unusedItems = targetCatData.items;
            }
            const correctItem = getRandomElem(unusedItems);
            usedImageIdsInRun.add(correctItem.id);

            // 3. Distraktoren wählen
            const distractors = getValidDistractors(targetCatKey, 2);
            distractors.forEach(d => usedImageIdsInRun.add(d.id));

            // 4. Optionen mischen
            const options = shuffle([
                { ...correctItem, isCorrect: true },
                { ...distractors[0], isCorrect: false },
                { ...distractors[1], isCorrect: false }
            ]);

            document.getElementById('task-text').innerText = targetCatData.prompt;

            // Karten rendern mit einheitlichen gelben Rahmen
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            options.forEach((opt, idx) => {
                const card = document.createElement('button');
                card.className = `game-card rounded-3xl aspect-square w-full pop-in relative overflow-hidden`;
                card.style.animationDelay = `${idx * 0.08}s`;

                card.innerHTML = `
                    <img src="${opt.img}" alt="${opt.name}" class="card-img" onerror="this.onerror=null; this.src='${opt.fallback}';">
                `;

                card.onclick = () => handleAnswer(opt, card);
                container.appendChild(card);
            });

            setTimeout(() => {
                speakTask();
            }, 250);
        }

        function speakTask() {
            speak(currentSpeechPromptText);
        }

        function handleAnswer(option, cardElement) {
            if (isAnsweringBlocked) return;

            if (option.isCorrect) {
                isAnsweringBlocked = true;
                playSound('correct');
                score++;
                currentQuestion++;
                updateScoreDisplay();

                // Bei richtiger Antwort wird der Rahmen GRÜN
                cardElement.style.borderColor = '#10b981';
                cardElement.classList.add('scale-105');

                const feedback = document.getElementById('feedback-message');
                feedback.innerText = "Richtig! Super! ✨";
                feedback.classList.remove('opacity-0');

                speak("Das ist richtig!", () => {
                    if (currentQuestion >= TOTAL_QUESTIONS) {
                        setTimeout(showEndGame, 400);
                    } else {
                        setTimeout(showNextQuestion, 500);
                    }
                });

            } else {
                playSound('wrong');
                
                // Bei falscher Antwort wird der Rahmen ROT & wackelt
                cardElement.style.borderColor = '#ef4444';
                cardElement.classList.add('shake');

                setTimeout(() => {
                    cardElement.classList.remove('shake');
                    // Rahmen wieder auf das Standard-Gelb zurücksetzen
                    cardElement.style.borderColor = '#fbbf24';
                }, 450);

                speak("Versuche es nochmal!");
            }
        }

        function showEndGame() {
            playSound('correct');

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 130,
                    spread: 85,
                    origin: { y: 0.6 }
                });
            }

            showScreen('screen-end');
            speak("Bravo! Du hast alle 6 Aufgaben geschafft!");
        }

        window.onload = function() {
            showScreen('screen-start');
        };
    </script>
</body>
